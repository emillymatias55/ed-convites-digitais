<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ED Convites Digitais</title><style>
:root{--pink:#d773a6;--purple:#835b90;--gold:#c9a86a}*{box-sizing:border-box}body{margin:0;background:#fff9fc;color:#4d3450;font:15px Arial,sans-serif}header{background:linear-gradient(140deg,#f6dde5,#dccff0);padding:35px 14px;text-align:center}.logo{font:64px Georgia,serif;color:#b78c48}h1{font:26px Georgia,serif;margin:4px 0}header p{line-height:1.5}.wrap{max-width:1000px;margin:auto;padding:20px}nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}button,.btn{border:0;border-radius:22px;padding:11px 15px;background:#e9d8e9;color:#60385f;font-weight:bold;cursor:pointer}nav button.active{background:var(--purple);color:white}input{width:100%;padding:14px;border:1px solid #dbc8df;border-radius:12px;font-size:16px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px #dcc9d944;text-align:center;padding-bottom:15px}.card img{width:100%;height:230px;object-fit:cover;object-position:top;background:#f6dde5;cursor:pointer}.card h3{font-size:15px;min-height:32px;padding:0 10px}.price{color:#aa4f87;font-size:19px;font-weight:bold}.btn{display:inline-block;text-decoration:none;background:#bd679b;color:#fff;margin:4px;font-size:12px}.btn.alt{background:#9868af}.notice{text-align:center;color:#795e77;line-height:1.5}dialog{border:0;border-radius:18px;box-shadow:0 8px 50px #0005;max-height:90vh;width:min(90vw,500px);padding:15px;text-align:center}dialog img{max-height:70vh;max-width:100%;object-fit:contain}dialog::backdrop{background:#0009}footer{text-align:center;background:#f6dde5;padding:22px;margin-top:28px}.empty{text-align:center;grid-column:1/-1;padding:25px}</style></head><body>
<header><div class="logo">ED ♡</div><h1>ED Convites Digitais</h1><p>Seu momento especial começa com um convite inesquecível! 💌</p></header>
<div class="wrap"><nav><button class="active" onclick="filterType('todos',this)">Todos</button><button onclick="filterType('simples',this)">Convites simples</button><button onclick="filterType('animados',this)">Convites animados</button><button onclick="filterType('cartinhas',this)">Cartinhas</button></nav><input id="search" placeholder="🔎 Procurar convite por tema..." oninput="render()"><p class="notice">Escolha um modelo e envie o pedido pelo WhatsApp. Personalização e pagamento são combinados no atendimento.</p><div class="grid" id="grid"></div></div><dialog id="preview"><button onclick="document.getElementById('preview').close()">Fechar ✕</button><p id="caption"></p><img id="big" alt="Prévia do convite"><div id="next" style="margin-top:12px"></div></dialog><footer>💗 ED Convites Digitais <p>Atendimento pelo WhatsApp</p><a class="btn" href="https://wa.me/5538991254584">Falar com a ED</a></footer>
<script>const products=[{"nome": "Futebol Brasil", "tipo": "simples", "imagem": "imagens/simples-66.jpg"}, {"nome": "Pop It Pastel", "tipo": "simples", "imagem": "imagens/simples-69.jpg"}, {"nome": "Pop It Colorido", "tipo": "simples", "imagem": "imagens/simples-70.jpg"}, {"nome": "Fazendinha João Lucas", "tipo": "simples", "imagem": "imagens/simples-71.jpg"}, {"nome": "Fazendinha Enzo", "tipo": "simples", "imagem": "imagens/simples-72.jpg"}, {"nome": "Fazendinha Sofia", "tipo": "simples", "imagem": "imagens/simples-73.jpg"}, {"nome": "Mickey Safari", "tipo": "simples", "imagem": "imagens/simples-76.jpg"}, {"nome": "Transportes", "tipo": "simples", "imagem": "imagens/simples-79.jpg"}, {"nome": "Safari Macaquinho", "tipo": "simples", "imagem": "imagens/simples-80.jpg"}, {"nome": "Chá de Fraldas Unicórnio", "tipo": "simples", "imagem": "imagens/simples-81.jpg"}, {"nome": "Chá de Bebê Elefantinho", "tipo": "simples", "imagem": "imagens/simples-82.jpg"}, {"nome": "Arlequina", "tipo": "simples", "imagem": "imagens/simples-84.jpg"}, {"nome": "Arlequina Infantil", "tipo": "simples", "imagem": "imagens/simples-85.jpg"}, {"nome": "Arlequina Colorida", "tipo": "simples", "imagem": "imagens/simples-86.jpg"}, {"nome": "Barbie Princesa", "tipo": "simples", "imagem": "imagens/simples-87.jpg"}, {"nome": "Barbie Pop Star", "tipo": "simples", "imagem": "imagens/simples-88.jpg"}, {"nome": "Barbie Rosa", "tipo": "simples", "imagem": "imagens/simples-89.jpg"}, {"nome": "Astronauta", "tipo": "simples", "imagem": "imagens/simples-90.jpg"}, {"nome": "Espaço Sideral", "tipo": "simples", "imagem": "imagens/simples-91.jpg"}, {"nome": "Joaninha Vermelha", "tipo": "simples", "imagem": "imagens/simples-92.jpg"}, {"nome": "Joaninha Laranja", "tipo": "simples", "imagem": "imagens/simples-93.jpg"}, {"nome": "Joaninha Amarela", "tipo": "simples", "imagem": "imagens/simples-94.jpg"}, {"nome": "Valente Moldura", "tipo": "simples", "imagem": "imagens/simples-95.jpg"}, {"nome": "Valente Floresta", "tipo": "simples", "imagem": "imagens/simples-96.jpg"}, {"nome": "Toy Story Infantil", "tipo": "simples", "imagem": "imagens/simples-97.jpg"}, {"nome": "Toy Story Woody e Buzz", "tipo": "simples", "imagem": "imagens/simples-98.jpg"}, {"nome": "Toy Story Turma", "tipo": "simples", "imagem": "imagens/simples-99.jpg"}, {"nome": "Jardim das Borboletas", "tipo": "simples", "imagem": "imagens/simples-100.jpg"}, {"nome": "Borboletas Rosas", "tipo": "simples", "imagem": "imagens/simples-101.jpg"}, {"nome": "Unicórnio Floral", "tipo": "simples", "imagem": "imagens/simples-102.jpg"}, {"nome": "Unicórnio Colorido", "tipo": "simples", "imagem": "imagens/simples-103.jpg"}, {"nome": "Como Treinar Seu Dragão", "tipo": "cartinhas", "imagem": "imagens/cartinha-1-1.jpg", "interior": "imagens/cartinha-1-2.jpg"}, {"nome": "Cinderela", "tipo": "cartinhas", "imagem": "imagens/cartinha-2-1.jpg", "interior": "imagens/cartinha-2-2.jpg"}, {"nome": "Guerreiras do K-Pop", "tipo": "cartinhas", "imagem": "imagens/cartinha-3-1.jpg", "interior": "imagens/cartinha-3-2.jpg"}, {"nome": "Branca de Neve", "tipo": "cartinhas", "imagem": "imagens/cartinha-4-1.jpg", "interior": "imagens/cartinha-4-2.jpg"}, {"nome": "Mickey Safari", "tipo": "cartinhas", "imagem": "imagens/cartinha-5-1.jpg", "interior": "imagens/cartinha-5-2.jpg"}, {"nome": "Capivara com Morangos", "tipo": "cartinhas", "imagem": "imagens/cartinha-6-1.jpg", "interior": "imagens/cartinha-6-2.jpg"}];let current='todos';function filterType(t,b){current=t;document.querySelectorAll('nav button').forEach(n=>n.classList.remove('active'));b.classList.add('active');render()}function link(p,v,price){let m=`Olá! Quero encomendar o convite ${p.nome}, versão ${v}, no valor de R$ ${price.toFixed(2).replace('.',',')}.`;return 'https://wa.me/5538991254584?text='+encodeURIComponent(m)}function preview(i,second=false){let p=products[i];document.getElementById('caption').textContent=p.nome;document.getElementById('big').src=second?p.interior:p.imagem;document.getElementById('next').innerHTML=p.interior?`<button onclick="preview(${i},${!second})">${second?'Ver capa':'Ver convite aberto'}</button>`:'';document.getElementById('preview').showModal()}function render(){let q=document.getElementById('search').value.toLocaleLowerCase('pt-BR');let g=document.getElementById('grid');g.innerHTML='';let count=0;products.forEach((p,i)=>{if((current!=='todos'&&p.tipo!==current)||!p.nome.toLocaleLowerCase('pt-BR').includes(q))return;count++;let c=document.createElement('div');c.className='card';let actions=p.tipo==='cartinhas'?`<a class="btn" target="_blank" rel="noopener" href="${link(p,'padrão',20)}">Padrão R$ 20</a><a class="btn alt" target="_blank" rel="noopener" href="${link(p,'com botões clicáveis',40)}">Botões R$ 40</a>`:`<a class="btn" target="_blank" rel="noopener" href="${link(p,'simples',10)}">Pedir pelo WhatsApp</a>`;c.innerHTML=`<img loading="lazy" src="${p.imagem}" alt="${p.nome}"><h3>${p.nome}</h3><div class="price">${p.tipo==='cartinhas'?'A partir de R$ 20,00':'R$ 10,00'}</div><button style="margin-top:8px" onclick="preview(${i})">Ver modelo</button><br>${actions}`;c.querySelector('img').onclick=()=>preview(i);g.appendChild(c)});if(!count)g.innerHTML='<p class="empty">Nenhum convite cadastrado nesta categoria ainda. 💗<br>Os vídeos animados poderão ser adicionados futuramente.</p>'}render();</script></body></html>
