align:center;background:#f6dde5;padding:22px;margin-top:28px}@media(max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card img{height:210px}.btn{padding:9px 8px}}

let current='todos';
function filterType(t,b){current=t;document.querySelectorAll('nav button').forEach(n=>n.classList.remove('active'));b.classList.add('active');document.getElementById('themeFilter').value='';updateThemes();render()}
function updateThemes(){let s=document.getElementById('themeFilter');let prior=s.value;const ts=[...new Set(products.filter(p=>current==='todos'||p.tipo===current).map(p=>p.tema))].sort((a,b)=>a.localeCompare(b,'pt-BR'));s.innerHTML='<option value="">Todos os temas</option>';ts.forEach(t=>{let o=document.createElement('option');o.value=t;o.textContent=t;s.appendChild(o)});if(ts.includes(prior))s.value=prior}
function link(p,versao,preco){const msg=`Olá! Quero encomendar o convite ${p.nome}, versão ${versao}, no valor de R$ ${preco.toFixed(2).replace('.',',')}.`;return 'https://wa.me/5538991254584?text='+encodeURIComponent(msg)}
function preview(i,second=false){let p=products[i];document.getElementById('caption').textContent=p.nome;document.getElementById('big').src=second?p.interior:p.imagem;document.getElementById('next').innerHTML=p.interior?`<button onclick="preview(${i},${!second})">${second?'Ver capa':'Ver convite aberto'}</button>`:'';let d=document.getElementById('preview');if(!d.open)d.showModal()}
function render(){let q=document.getElementById('search').value.toLocaleLowerCase('pt-BR');let selected=document.getElementById('themeFilter').value;let target=document.getElementById('catalog');target.innerHTML='';let matched=products.map((p,i)=>({...p,i})).filter(p=>(current==='todos'||p.tipo===current)&&(!selected||p.tema===selected)&&(p.nome+' '+p.tema).toLocaleLowerCase('pt-BR').includes(q));if(!matched.length){target.innerHTML='<p class="empty">Nenhum convite encontrado nesta seleção. 💗'+(current==='animados'?'<br>Os vídeos poderão ser adicionados futuramente.':'')+'</p>';return}let groups=new Map();matched.forEach(p=>{let key=p.tema;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)});[...groups.keys()].sort((a,b)=>a.localeCompare(b,'pt-BR')).forEach(theme=>{let section=document.createElement('section');section.className='theme';let heading=document.createElement('h2');heading.textContent=theme+' ';let small=document.createElement('small');small.textContent='('+groups.get(theme).length+' modelo'+(groups.get(theme).length===1?'':'s')+')';heading.appendChild(small);section.appendChild(heading);let grid=document.createElement('div');grid.className='grid';groups.get(theme).forEach(p=>{let c=document.createElement('article');c.className='card';let actions=p.tipo==='cartinhas'?`<a class="btn" target="_blank" rel="noopener" href="${link(p,'padrão',20)}">Padrão R$ 20</a><a class="btn alt" target="_blank" rel="noopener" href="${link(p,'com botões clicáveis',40)}">Botões R$ 40</a>`:`<a class="btn" target="_blank" rel="noopener" href="${link(p,p.tipo==='animados'?'animado':'simples',p.tipo==='animados'?15:10)}">Pedir pelo WhatsApp</a>`;c.innerHTML=`<img loading="lazy" src="${p.imagem}" alt="${p.nome}"><h3>${p.nome}</h3><div class="price">${p.tipo==='cartinhas'?'A partir de R$ 20,00':p.tipo==='animados'?'R$ 15,00':'R$ 10,00'}</div><button style="margin-top:8px" onclick="preview(${p.i})">Ver modelo</button><br>${actions}`;c.querySelector('img').onclick=()=>preview(p.i);grid.appendChild(c)});section.appendChild(grid);target.appendChild(section)})}
updateThemes();render();
</script></body></html>
